<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PET Engine — Massive CYOA</title>
<style>
  :root {
    --bg: #efefeb;
    --card: #ffffff;
    --fg: #141414;
    --muted: #555555;
    --border: #141414;
    --tint: #e4e4de;
  }
  * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
  body {
    margin: 0; padding: 12px;
    background: var(--bg); color: var(--fg);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh;
  }
  #container {
    width: 100%; max-width: 480px;
    background: var(--card);
    border: 3px solid var(--border);
    box-shadow: 5px 5px 0 var(--border);
    padding: 16px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--border);
    padding-bottom: 10px; margin-bottom: 12px; gap: 8px;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; }
  .header-right { display: flex; align-items: center; gap: 6px; }
  .badge {
    font-size: 11px; padding: 3px 6px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--tint);
  }
  .lang-btn {
    font-size: 11px; font-weight: bold; padding: 3px 7px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
    cursor: pointer; white-space: nowrap;
  }
  .lang-btn:active { background: var(--fg); color: var(--card); }
  .meta-bar {
    font-size: 12px; color: var(--muted);
    margin-bottom: 10px; display: flex; justify-content: space-between;
  }
  .stats-bar {
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    background: var(--tint); border: 1px solid var(--border);
    padding: 8px 10px; margin-bottom: 14px; font-size: 12px;
  }
  .narrative {
    font-size: 15px; line-height: 1.6;
    margin-bottom: 16px; min-height: 150px;
    white-space: pre-line;
  }
  .roll-banner {
    border: 2px solid var(--border); background: var(--tint);
    padding: 8px 10px; margin-bottom: 12px; font-size: 13px;
    display: none;
  }
  .ending-box {
    border: 2px solid var(--border); background: var(--tint);
    padding: 10px; margin-bottom: 14px; font-size: 13px;
  }
  .btn {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 8px;
    font-size: 14px; font-weight: bold;
    background: var(--card); color: var(--fg);
    border: 2px solid var(--border);
    cursor: pointer; transition: background 0.1s;
  }
  .btn:hover { background: var(--tint); }
  .btn:active { background: var(--fg); color: var(--card); }
  .btn:disabled { opacity: 0.45; border-style: dashed; cursor: not-allowed; }
  .btn-sm {
    padding: 8px 6px; font-size: 11px; text-align: center; margin-bottom: 0;
  }
  .footer-nav {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-top: 16px; padding-top: 12px;
    border-top: 2px dashed var(--border);
  }
  .panel {
    margin-top: 12px; padding: 10px;
    border: 2px solid var(--border); background: var(--bg);
    font-size: 12px; display: none; line-height: 1.5;
  }
  .game-card {
    border: 2px solid var(--border); padding: 12px; margin-bottom: 10px;
  }
  .game-card h3 { margin: 0 0 4px 0; font-size: 15px; }
  .game-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div id="container">
  <header>
    <h1 id="header-title">POCKET E-TABLETOP</h1>
    <div class="header-right">
      <button class="lang-btn" id="btn-lang" onclick="toggleLang()">EN | ID</button>
      <span class="badge" id="mode-badge">HUB</span>
    </div>
  </header>

  <!-- HUB -->
  <div id="view-hub">
    <p id="hub-intro" style="font-size:13px; margin-top:0;"></p>
    <div id="game-list"></div>
  </div>

  <!-- GAMEPLAY -->
  <div id="view-game" style="display:none;">
    <div class="meta-bar">
      <span id="ui-chapter">Chapter -</span>
      <span id="ui-endings-count">Endings: 0/0</span>
    </div>

    <div class="stats-bar" id="ui-stats"></div>
    <div class="roll-banner" id="ui-roll"></div>
    <div id="ui-ending-banner"></div>
    <div class="narrative" id="ui-text"></div>
    <div id="ui-choices"></div>

    <div class="footer-nav">
      <button class="btn btn-sm" id="nav-bag" onclick="togglePanel('inv')"></button>
      <button class="btn btn-sm" id="nav-endings" onclick="togglePanel('endings')"></button>
      <button class="btn btn-sm" id="nav-cp" onclick="loadCheckpoint()"></button>
      <button class="btn btn-sm" id="nav-hub" onclick="backToHub()"></button>
    </div>
    <div class="panel" id="ui-panel"></div>
  </div>
</div>

<script>
const UI_STRINGS = {
  en: {
    hubIntro: "Select an adventure. Progress is saved automatically in your browser; unlocked endings are tracked per story.",
    totalEndings: "Total Endings",
    playBtn: "[ PLAY / CONTINUE ]",
    chapterFallback: "Chapter",
    endingsLabel: "Endings",
    navBag: "BAG & FLAGS",
    navEndings: "ENDINGS",
    navCp: "CHECKPOINT",
    navHub: "HUB",
    loadErr: "Failed to load story file.",
    loadErrHint: "Make sure the JSON file exists in the repository.",
    noCp: "No checkpoint saved yet.",
    cpLoaded: "Chapter checkpoint loaded.",
    restarted: "Adventure restarted from the beginning.",
    missingNode: (id) => `Node "${id}" was not found in JSON.`,
    fallenText: "Your vitality dropped to zero. Your journey ends here.\n\n[ FALLEN ]",
    backToCp: "> Return to Chapter Checkpoint",
    restartZero: "> Restart from Beginning",
    endingReached: "ENDING REACHED",
    skillCheckFmt: (stat, dc) => `[${stat.toUpperCase()} Check DC ${dc}]`,
    reqNotMet: "(Requirements not met)",
    rollFmt: (stat, d6, mod, total, dc, passed) =>
      `${stat.toUpperCase()} Check: Die(${d6}) + Stat(${mod}) = ${total} vs DC ${dc} -> ${passed ? "SUCCESS" : "FAILURE"}`,
    invLabel: "INVENTORY",
    empty: "Empty",
    flagsLabel: "FLAGS / MARKS",
    none: "None",
    resetTotalBtn: "[ FULL RESET FROM START ]",
    endingGalleryTitle: "ENDING GALLERY",
    unknownEnding: "[??? — Locked]",
    noEndingData: "No ending data available."
  },
  id: {
    hubIntro: "Pilih petualangan. Progres tersimpan otomatis di browser; ending yang terbuka dicatat per cerita.",
    totalEndings: "Total Ending",
    playBtn: "[ MAINKAN / LANJUTKAN ]",
    chapterFallback: "Bab",
    endingsLabel: "Ending",
    navBag: "TAS & FLAG",
    navEndings: "ENDING",
    navCp: "CHECKPOINT",
    navHub: "MENU",
    loadErr: "Gagal memuat file cerita.",
    loadErrHint: "Pastikan file JSON ada di repository.",
    noCp: "Belum ada checkpoint tersimpan.",
    cpLoaded: "Checkpoint bab dimuat.",
    restarted: "Petualangan dimulai ulang dari awal.",
    missingNode: (id) => `Node "${id}" tidak ditemukan di JSON.`,
    fallenText: "Energi kehidupanmu habis. Perjalanan terhenti di sini.\n\n[ GUGUR ]",
    backToCp: "> Kembali ke Checkpoint Bab",
    restartZero: "> Mulai Ulang dari Awal",
    endingReached: "ENDING TERCAPAI",
    skillCheckFmt: (stat, dc) => `[Uji ${stat.toUpperCase()} DC ${dc}]`,
    reqNotMet: "(Syarat belum terpenuhi)",
    rollFmt: (stat, d6, mod, total, dc, passed) =>
      `Uji ${stat.toUpperCase()}: Dadu(${d6}) + Stat(${mod}) = ${total} vs DC ${dc} -> ${passed ? "BERHASIL" : "GAGAL"}`,
    invLabel: "INVENTARIS",
    empty: "Kosong",
    flagsLabel: "JEJAK / FLAGS",
    none: "Belum ada",
    resetTotalBtn: "[ RESET TOTAL DARI AWAL ]",
    endingGalleryTitle: "GALERI ENDING",
    unknownEnding: "[??? — Belum Terbuka]",
    noEndingData: "Belum ada data ending."
  }
};

const CATALOG = [
  {
    file: "games/main_story01.json",
    fallbackTitle: { en: "CHRONICLES OF THE MIST VALLEY", id: "KRONIK LEMBAH KABUT" },
    fallbackDesc: {
      en: "Multi-chapter CYOA with Skill Checks, Flags, Checkpoints, and Multiple Endings.",
      id: "CYOA multi-bab dengan Skill Check, Flags, Checkpoint, dan Multiple Endings."
    }
  }
];

let lang = localStorage.getItem("pet_lang") || "en";
let activeStory = null;
let currentFilePath = null;
let state = null;
let unlockedEndings = [];
let lastRollEvent = null;

function ui() {
  return UI_STRINGS[lang] || UI_STRINGS.en;
}

function t(val) {
  if (val && typeof val === "object") {
    return val[lang] ?? val.en ?? val.id ?? "";
  }
  return val ?? "";
}

function applyLangUI() {
  document.documentElement.lang = lang;
  document.getElementById("btn-lang").innerText = lang === "en" ? "EN | ID" : "ID | EN";
  document.getElementById("hub-intro").innerText = ui().hubIntro;
  document.getElementById("nav-bag").innerText = ui().navBag;
  document.getElementById("nav-endings").innerText = ui().navEndings;
  document.getElementById("nav-cp").innerText = ui().navCp;
  document.getElementById("nav-hub").innerText = ui().navHub;

  const isGameOpen = document.getElementById("view-game").style.display !== "none";
  if (isGameOpen && activeStory) {
    document.getElementById("header-title").innerText = t(activeStory.title) || "CYOA";
    const panel = document.getElementById("ui-panel");
    if (panel.style.display === "block" && panel.dataset.tab) {
      renderPanelContent(panel.dataset.tab);
    }
    renderNode();
  } else {
    document.getElementById("header-title").innerText = "POCKET E-TABLETOP";
    initHub();
  }
}

function toggleLang() {
  lang = lang === "en" ? "id" : "en";
  localStorage.setItem("pet_lang", lang);
  applyLangUI();
}

async function initHub() {
  const listEl = document.getElementById("game-list");
  listEl.innerHTML = "";

  for (const item of CATALOG) {
    let meta = {
      title: t(item.fallbackTitle),
      desc: t(item.fallbackDesc),
      endingsTotal: "?"
    };
    try {
      const res = await fetch(item.file + "?v=" + Date.now());
      if (res.ok) {
        const data = await res.json();
        meta.title = t(data.title) || meta.title;
        meta.desc = t(data.description) || meta.desc;
        meta.endingsTotal = Object.keys(data.endings || {}).length;
      }
    } catch (_) {}

    const card = document.createElement("div");
    card.className = "game-card";
    card.innerHTML = `
      <h3>${escapeHtml(meta.title)}</h3>
      <p>${escapeHtml(meta.desc)} • ${escapeHtml(ui().totalEndings)}: ${meta.endingsTotal}</p>
      <button class="btn btn-sm" onclick="openStory('${item.file}')">${escapeHtml(ui().playBtn)}</button>
    `;
    listEl.appendChild(card);
  }
}

async function openStory(filePath) {
  currentFilePath = filePath;
  try {
    const res = await fetch(filePath + "?v=" + Date.now());
    if (!res.ok) throw new Error(ui().loadErr);
    activeStory = await res.json();
  } catch (err) {
    alert(`${ui().loadErr} (${err.message})\n${ui().loadErrHint}`);
    return;
  }

  const storyKey = activeStory.id || filePath;
  unlockedEndings = JSON.parse(localStorage.getItem("pet_endings_" + storyKey) || "[]");

  const saved = localStorage.getItem("pet_save_" + storyKey);
  if (saved) {
    state = JSON.parse(saved);
  } else {
    state = createFreshState(activeStory);
    saveCheckpoint();
    saveState();
  }

  lastRollEvent = null;
  document.getElementById("view-hub").style.display = "none";
  document.getElementById("view-game").style.display = "block";
  document.getElementById("header-title").innerText = t(activeStory.title) || "CYOA";
  document.getElementById("mode-badge").innerText = "CYOA";
  document.getElementById("ui-panel").style.display = "none";
  renderNode();
}

function createFreshState(story) {
  const init = story.initialState || {};
  return {
    node: init.node || "start",
    chapter: init.chapter || { en: "Chapter 1", id: "Bab 1" },
    stats: Object.assign({ hp: 10, wit: 2, str: 2, cha: 2 }, init.stats || {}),
    inv: Array.isArray(init.inv) ? [...init.inv] : [],
    flags: Object.assign({}, init.flags || {})
  };
}

function saveState() {
  const storyKey = activeStory.id || currentFilePath;
  localStorage.setItem("pet_save_" + storyKey, JSON.stringify(state));
}

function saveCheckpoint() {
  const storyKey = activeStory.id || currentFilePath;
  localStorage.setItem("pet_cp_" + storyKey, JSON.stringify(state));
}

function loadCheckpoint() {
  const storyKey = activeStory.id || currentFilePath;
  const cp = localStorage.getItem("pet_cp_" + storyKey);
  if (!cp) {
    alert(ui().noCp);
    return;
  }
  state = JSON.parse(cp);
  lastRollEvent = { customText: ui().cpLoaded };
  saveState();
  renderNode();
}

function recordEnding(endingId) {
  const storyKey = activeStory.id || currentFilePath;
  if (!unlockedEndings.includes(endingId)) {
    unlockedEndings.push(endingId);
    localStorage.setItem("pet_endings_" + storyKey, JSON.stringify(unlockedEndings));
  }
}

function checkCondition(cond) {
  if (!cond) return true;
  if (cond.hasItem && !state.inv.includes(cond.hasItem)) return false;
  if (cond.lacksItem && state.inv.includes(cond.lacksItem)) return false;
  if (cond.flagTrue && !state.flags[cond.flagTrue]) return false;
  if (cond.flagFalse && !!state.flags[cond.flagFalse]) return false;
  if (cond.minStat) {
    for (const [k, minVal] of Object.entries(cond.minStat)) {
      if ((state.stats[k] ?? 0) < minVal) return false;
    }
  }
  return true;
}

function applyEffects(eff) {
  if (!eff) return;
  if (eff.stats) {
    for (const [k, delta] of Object.entries(eff.stats)) {
      state.stats[k] = (state.stats[k] ?? 0) + delta;
    }
  }
  if (eff.addItem && !state.inv.includes(eff.addItem)) {
    state.inv.push(eff.addItem);
  }
  if (eff.removeItem) {
    state.inv = state.inv.filter(i => i !== eff.removeItem);
  }
  if (eff.setFlags) {
    for (const [k, v] of Object.entries(eff.setFlags)) {
      state.flags[k] = v;
    }
  }
  if (eff.chapter) {
    state.chapter = eff.chapter;
    saveCheckpoint();
  }
}

function renderNode() {
  const node = activeStory.nodes[state.node];
  const totalEndings = Object.keys(activeStory.endings || {}).length;

  document.getElementById("ui-chapter").innerText = t(state.chapter) || ui().chapterFallback;
  document.getElementById("ui-endings-count").innerText = `${ui().endingsLabel}: ${unlockedEndings.length}/${totalEndings}`;

  const statsEl = document.getElementById("ui-stats");
  statsEl.innerHTML = Object.entries(state.stats)
    .map(([k, v]) => `<span>${k.toUpperCase()}: <b>${v}</b></span>`)
    .join("");

  const rollEl = document.getElementById("ui-roll");
  if (lastRollEvent) {
    rollEl.style.display = "block";
    if (lastRollEvent.customText) {
      rollEl.innerText = lastRollEvent.customText;
    } else {
      const r = lastRollEvent;
      rollEl.innerText = ui().rollFmt(r.stat, r.d6, r.mod, r.total, r.dc, r.passed);
    }
  } else {
    rollEl.style.display = "none";
  }

  const endBannerEl = document.getElementById("ui-ending-banner");
  endBannerEl.innerHTML = "";

  const choicesEl = document.getElementById("ui-choices");
  choicesEl.innerHTML = "";

  if (!node) {
    document.getElementById("ui-text").innerText = ui().missingNode(state.node);
    return;
  }

  if (state.stats.hp <= 0 && !node.ending) {
    document.getElementById("ui-text").innerText = ui().fallenText;
    choicesEl.innerHTML = `
      <button class="btn" onclick="loadCheckpoint()">${escapeHtml(ui().backToCp)}</button>
      <button class="btn" onclick="restartFromZero()">${escapeHtml(ui().restartZero)}</button>
    `;
    return;
  }

  document.getElementById("ui-text").innerText = t(node.text);

  if (node.ending && activeStory.endings && activeStory.endings[node.ending]) {
    const endInfo = activeStory.endings[node.ending];
    recordEnding(node.ending);
    document.getElementById("ui-endings-count").innerText = `${ui().endingsLabel}: ${unlockedEndings.length}/${totalEndings}`;
    endBannerEl.innerHTML = `
      <div class="ending-box">
        <b>${escapeHtml(ui().endingReached)}: ${escapeHtml(t(endInfo.title))}</b><br>
        <span>${escapeHtml(t(endInfo.summary))}</span>
      </div>
    `;
  }

  (node.choices || []).forEach(ch => {
    const btn = document.createElement("button");
    btn.className = "btn";
    const ok = checkCondition(ch.req);
    let label = t(ch.text);
    if (ch.skillCheck) {
      label += " " + ui().skillCheckFmt(ch.skillCheck.stat, ch.skillCheck.dc);
    }
    if (!ok) {
      label += " " + ui().reqNotMet;
    }
    btn.innerText = label;
    btn.disabled = !ok;
    btn.onclick = () => handleChoice(ch);
    choicesEl.appendChild(btn);
  });
}

function handleChoice(ch) {
  lastRollEvent = null;
  let targetId = ch.next;

  if (ch.skillCheck) {
    const sc = ch.skillCheck;
    const d6 = Math.floor(Math.random() * 6) + 1;
    const mod = state.stats[sc.stat] ?? 0;
    const total = d6 + mod;
    const passed = total >= sc.dc;
    lastRollEvent = { stat: sc.stat, d6, mod, total, dc: sc.dc, passed };
    targetId = passed ? sc.onSuccess : sc.onFail;
    applyEffects(passed ? sc.successEffects : sc.failEffects);
  }

  applyEffects(ch.effects);
  state.node = targetId;

  const nextNode = activeStory.nodes[state.node];
  if (nextNode && nextNode.onEnter) {
    applyEffects(nextNode.onEnter);
  }

  saveState();
  renderNode();
}

function restartFromZero() {
  state = createFreshState(activeStory);
  lastRollEvent = { customText: ui().restarted };
  saveCheckpoint();
  saveState();
  renderNode();
}

function renderPanelContent(tab) {
  const p = document.getElementById("ui-panel");
  if (tab === "inv") {
    const items = state.inv.length ? state.inv.join(", ") : ui().empty;
    const activeFlags = Object.entries(state.flags).filter(([, v]) => !!v).map(([k]) => k);
    p.innerHTML = `
      <b>${escapeHtml(ui().invLabel)}:</b> ${escapeHtml(items)}<br>
      <b>${escapeHtml(ui().flagsLabel)}:</b> ${activeFlags.length ? escapeHtml(activeFlags.join(", ")) : escapeHtml(ui().none)}<br><br>
      <button class="btn btn-sm" onclick="restartFromZero()">${escapeHtml(ui().resetTotalBtn)}</button>
    `;
  } else if (tab === "endings") {
    const endings = activeStory.endings || {};
    const rows = Object.entries(endings).map(([id, info]) => {
      const found = unlockedEndings.includes(id);
      return found
        ? `• <b>${escapeHtml(t(info.title))}</b>: ${escapeHtml(t(info.summary))}`
        : `• <i>${escapeHtml(ui().unknownEnding)}</i>`;
    });
    p.innerHTML = `<b>${escapeHtml(ui().endingGalleryTitle)} (${unlockedEndings.length}/${Object.keys(endings).length}):</b><br>` +
      (rows.length ? rows.join("<br>") : `<i>${escapeHtml(ui().noEndingData)}</i>`);
  }
}

function togglePanel(tab) {
  const p = document.getElementById("ui-panel");
  const isSameOpen = p.style.display === "block" && p.dataset.tab === tab;
  if (isSameOpen) {
    p.style.display = "none";
    return;
  }
  p.dataset.tab = tab;
  p.style.display = "block";
  renderPanelContent(tab);
}

function backToHub() {
  document.getElementById("view-game").style.display = "none";
  document.getElementById("view-hub").style.display = "block";
  document.getElementById("header-title").innerText = "POCKET E-TABLETOP";
  document.getElementById("mode-badge").innerText = "HUB";
  initHub();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

applyLangUI();
</script>
</body>
</html>
