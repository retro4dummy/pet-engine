<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PET Engine — Massive CYOA</title>
<style>
  :root {
    --bg: #efefeb;
    --card: #ffffff;
    --fg: #141414;
    --muted: #555555;
    --border: #141414;
    --tint: #e4e4de;
  }
  * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
  body {
    margin: 0; padding: 12px;
    background: var(--bg); color: var(--fg);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh;
  }
  #container {
    width: 100%; max-width: 480px;
    background: var(--card);
    border: 3px solid var(--border);
    box-shadow: 5px 5px 0 var(--border);
    padding: 16px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--border);
    padding-bottom: 10px; margin-bottom: 12px; gap: 8px;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; }
  .badge {
    font-size: 11px; padding: 2px 6px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--tint);
  }
  .meta-bar {
    font-size: 12px; color: var(--muted);
    margin-bottom: 10px; display: flex; justify-content: space-between;
  }
  .stats-bar {
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    background: var(--tint); border: 1px solid var(--border);
    padding: 8px 10px; margin-bottom: 14px; font-size: 12px;
  }
  .narrative {
    font-size: 15px; line-height: 1.6;
    margin-bottom: 16px; min-height: 150px;
    white-space: pre-line;
  }
  .roll-banner {
    border: 2px solid var(--border); background: var(--tint);
    padding: 8px 10px; margin-bottom: 12px; font-size: 13px;
    display: none;
  }
  .ending-box {
    border: 2px solid var(--border); background: var(--tint);
    padding: 10px; margin-bottom: 14px; font-size: 13px;
  }
  .btn {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 8px;
    font-size: 14px; font-weight: bold;
    background: var(--card); color: var(--fg);
    border: 2px solid var(--border);
    cursor: pointer; transition: background 0.1s;
  }
  .btn:hover { background: var(--tint); }
  .btn:active { background: var(--fg); color: var(--card); }
  .btn:disabled { opacity: 0.45; border-style: dashed; cursor: not-allowed; }
  .btn-sm {
    padding: 8px 6px; font-size: 11px; text-align: center; margin-bottom: 0;
  }
  .footer-nav {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-top: 16px; padding-top: 12px;
    border-top: 2px dashed var(--border);
  }
  .panel {
    margin-top: 12px; padding: 10px;
    border: 2px solid var(--border); background: var(--bg);
    font-size: 12px; display: none; line-height: 1.5;
  }
  .game-card {
    border: 2px solid var(--border); padding: 12px; margin-bottom: 10px;
  }
  .game-card h3 { margin: 0 0 4px 0; font-size: 15px; }
  .game-card p { margin: 0 0 10px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div id="container">
  <header>
    <h1 id="header-title">POCKET E-TABLETOP</h1>
    <span class="badge" id="mode-badge">HUB</span>
  </header>

  <!-- HUB -->
  <div id="view-hub">
    <p style="font-size:13px; margin-top:0;">Pilih petualangan. Progres tersimpan otomatis di browser; ending yang terbuka dicatat per cerita.</p>
    <div id="game-list"></div>
  </div>

  <!-- GAMEPLAY -->
  <div id="view-game" style="display:none;">
    <div class="meta-bar">
      <span id="ui-chapter">Bab -</span>
      <span id="ui-endings-count">Ending: 0/0</span>
    </div>

    <div class="stats-bar" id="ui-stats"></div>
    <div class="roll-banner" id="ui-roll"></div>
    <div id="ui-ending-banner"></div>
    <div class="narrative" id="ui-text"></div>
    <div id="ui-choices"></div>

    <div class="footer-nav">
      <button class="btn btn-sm" onclick="togglePanel('inv')">TAS & FLAG</button>
      <button class="btn btn-sm" onclick="togglePanel('endings')">ENDING</button>
      <button class="btn btn-sm" onclick="loadCheckpoint()">CHECKPOINT</button>
      <button class="btn btn-sm" onclick="backToHub()">MENU</button>
    </div>
    <div class="panel" id="ui-panel"></div>
  </div>
</div>

<script>
// Daftarkan file JSON cerita di folder games/
const CATALOG = [
  {
    file: "games/cerita_utama.json",
    fallbackTitle: "KRONIK LEMBAH KABUT",
    fallbackDesc: "CYOA multi-bab dengan Skill Check, Flags, Checkpoint, dan Multiple Endings."
  }
];

let activeStory = null;
let state = null;
let unlockedEndings = [];
let lastRollMsg = "";

async function initHub() {
  const listEl = document.getElementById("game-list");
  listEl.innerHTML = "";

  for (const item of CATALOG) {
    let meta = { title: item.fallbackTitle, desc: item.fallbackDesc, endingsTotal: "?" };
    try {
      const res = await fetch(item.file + "?v=" + Date.now());
      if (res.ok) {
        const data = await res.json();
        meta.title = data.title || meta.title;
        meta.desc = data.description || meta.desc;
        meta.endingsTotal = Object.keys(data.endings || {}).length;
      }
    } catch (_) {}

    const card = document.createElement("div");
    card.className = "game-card";
    card.innerHTML = `
      <h3>${escapeHtml(meta.title)}</h3>
      <p>${escapeHtml(meta.desc)} • Total Ending: ${meta.endingsTotal}</p>
      <button class="btn btn-sm" onclick="openStory('${item.file}')">[ MAINKAN / LANJUTKAN ]</button>
    `;
    listEl.appendChild(card);
  }
}

async function openStory(filePath) {
  try {
    const res = await fetch(filePath + "?v=" + Date.now());
    if (!res.ok) throw new Error("Gagal memuat file cerita.");
    activeStory = await res.json();
  } catch (err) {
    alert("Error memuat cerita: " + err.message + "\nPastikan file JSON ada di repository.");
    return;
  }

  const storyKey = activeStory.id || filePath;
  unlockedEndings = JSON.parse(localStorage.getItem("pet_endings_" + storyKey) || "[]");

  const saved = localStorage.getItem("pet_save_" + storyKey);
  if (saved) {
    state = JSON.parse(saved);
  } else {
    state = createFreshState(activeStory);
    saveCheckpoint();
    saveState();
  }

  lastRollMsg = "";
  document.getElementById("view-hub").style.display = "none";
  document.getElementById("view-game").style.display = "block";
  document.getElementById("header-title").innerText = activeStory.title || "CYOA";
  document.getElementById("mode-badge").innerText = "CYOA";
  document.getElementById("ui-panel").style.display = "none";
  renderNode();
}

function createFreshState(story) {
  const init = story.initialState || {};
  return {
    node: init.node || "start",
    chapter: init.chapter || "Bab 1",
    stats: Object.assign({ hp: 10, wit: 2, str: 2, cha: 2 }, init.stats || {}),
    inv: Array.isArray(init.inv) ? [...init.inv] : [],
    flags: Object.assign({}, init.flags || {})
  };
}

function saveState() {
  const storyKey = activeStory.id || activeStory.title;
  localStorage.setItem("pet_save_" + storyKey, JSON.stringify(state));
}

function saveCheckpoint() {
  const storyKey = activeStory.id || activeStory.title;
  localStorage.setItem("pet_cp_" + storyKey, JSON.stringify(state));
}

function loadCheckpoint() {
  const storyKey = activeStory.id || activeStory.title;
  const cp = localStorage.getItem("pet_cp_" + storyKey);
  if (!cp) {
    alert("Belum ada checkpoint tersimpan.");
    return;
  }
  state = JSON.parse(cp);
  lastRollMsg = "Checkpoint bab dimuat.";
  saveState();
  renderNode();
}

function recordEnding(endingId) {
  const storyKey = activeStory.id || activeStory.title;
  if (!unlockedEndings.includes(endingId)) {
    unlockedEndings.push(endingId);
    localStorage.setItem("pet_endings_" + storyKey, JSON.stringify(unlockedEndings));
  }
}

function checkCondition(cond) {
  if (!cond) return true;
  if (cond.hasItem && !state.inv.includes(cond.hasItem)) return false;
  if (cond.lacksItem && state.inv.includes(cond.lacksItem)) return false;
  if (cond.flagTrue && !state.flags[cond.flagTrue]) return false;
  if (cond.flagFalse && !!state.flags[cond.flagFalse]) return false;
  if (cond.minStat) {
    for (const [k, minVal] of Object.entries(cond.minStat)) {
      if ((state.stats[k] ?? 0) < minVal) return false;
    }
  }
  return true;
}

function applyEffects(eff) {
  if (!eff) return;
  if (eff.stats) {
    for (const [k, delta] of Object.entries(eff.stats)) {
      state.stats[k] = (state.stats[k] ?? 0) + delta;
    }
  }
  if (eff.addItem && !state.inv.includes(eff.addItem)) {
    state.inv.push(eff.addItem);
  }
  if (eff.removeItem) {
    state.inv = state.inv.filter(i => i !== eff.removeItem);
  }
  if (eff.setFlags) {
    for (const [k, v] of Object.entries(eff.setFlags)) {
      state.flags[k] = v;
    }
  }
  if (eff.chapter) {
    state.chapter = eff.chapter;
    saveCheckpoint();
  }
}

function renderNode() {
  const node = activeStory.nodes[state.node];
  const totalEndings = Object.keys(activeStory.endings || {}).length;

  document.getElementById("ui-chapter").innerText = state.chapter || "Bab";
  document.getElementById("ui-endings-count").innerText = `Ending: ${unlockedEndings.length}/${totalEndings}`;

  // Stats
  const statsEl = document.getElementById("ui-stats");
  statsEl.innerHTML = Object.entries(state.stats)
    .map(([k, v]) => `<span>${k.toUpperCase()}: <b>${v}</b></span>`)
    .join("");

  // Roll banner
  const rollEl = document.getElementById("ui-roll");
  if (lastRollMsg) {
    rollEl.style.display = "block";
    rollEl.innerText = lastRollMsg;
  } else {
    rollEl.style.display = "none";
  }

  // Ending banner
  const endBannerEl = document.getElementById("ui-ending-banner");
  endBannerEl.innerHTML = "";

  const choicesEl = document.getElementById("ui-choices");
  choicesEl.innerHTML = "";

  if (!node) {
    document.getElementById("ui-text").innerText = `Node "${state.node}" tidak ditemukan di JSON.`;
    return;
  }

  if (state.stats.hp <= 0 && !node.ending) {
    document.getElementById("ui-text").innerText = "Kondisimu jatuh ke titik nol. Perjalanan terhenti di sini.\n\n[ GUGUR ]";
    choicesEl.innerHTML = `
      <button class="btn" onclick="loadCheckpoint()">> Kembali ke Checkpoint Bab</button>
      <button class="btn" onclick="restartFromZero()">> Mulai Ulang dari Awal</button>
    `;
    return;
  }

  document.getElementById("ui-text").innerText = node.text || "";

  if (node.ending && activeStory.endings && activeStory.endings[node.ending]) {
    const endInfo = activeStory.endings[node.ending];
    recordEnding(node.ending);
    document.getElementById("ui-endings-count").innerText = `Ending: ${unlockedEndings.length}/${totalEndings}`;
    endBannerEl.innerHTML = `
      <div class="ending-box">
        <b>ENDING TERCAPAI: ${escapeHtml(endInfo.title)}</b><br>
        <span>${escapeHtml(endInfo.summary || "")}</span>
      </div>
    `;
  }

  (node.choices || []).forEach(ch => {
    const btn = document.createElement("button");
    btn.className = "btn";
    const ok = checkCondition(ch.req);
    let label = ch.text;
    if (ch.skillCheck) {
      label += ` [Uji ${ch.skillCheck.stat.toUpperCase()} DC ${ch.skillCheck.dc}]`;
    }
    if (!ok) {
      label += " (Syarat belum terpenuhi)";
    }
    btn.innerText = label;
    btn.disabled = !ok;
    btn.onclick = () => handleChoice(ch);
    choicesEl.appendChild(btn);
  });
}

function handleChoice(ch) {
  lastRollMsg = "";
  let targetId = ch.next;

  if (ch.skillCheck) {
    const sc = ch.skillCheck;
    const d6 = Math.floor(Math.random() * 6) + 1;
    const mod = state.stats[sc.stat] ?? 0;
    const total = d6 + mod;
    const passed = total >= sc.dc;
    lastRollMsg = `Uji ${sc.stat.toUpperCase()}: Dadu(${d6}) + Stat(${mod}) = ${total} vs DC ${sc.dc} -> ${passed ? "BERHASIL" : "GAGAL"}`;
    targetId = passed ? sc.onSuccess : sc.onFail;
    applyEffects(passed ? sc.successEffects : sc.failEffects);
  }

  applyEffects(ch.effects);
  state.node = targetId;

  const nextNode = activeStory.nodes[state.node];
  if (nextNode && nextNode.onEnter) {
    applyEffects(nextNode.onEnter);
  }

  saveState();
  renderNode();
}

function restartFromZero() {
  state = createFreshState(activeStory);
  lastRollMsg = "Petualangan dimulai ulang dari awal.";
  saveCheckpoint();
  saveState();
  renderNode();
}

function togglePanel(tab) {
  const p = document.getElementById("ui-panel");
  const isSameOpen = p.style.display === "block" && p.dataset.tab === tab;
  if (isSameOpen) {
    p.style.display = "none";
    return;
  }
  p.dataset.tab = tab;
  p.style.display = "block";

  if (tab === "inv") {
    const items = state.inv.length ? state.inv.join(", ") : "Kosong";
    const activeFlags = Object.entries(state.flags).filter(([, v]) => !!v).map(([k]) => k);
    p.innerHTML = `
      <b>INVENTARIS:</b> ${escapeHtml(items)}<br>
      <b>JEJAK / FLAGS:</b> ${activeFlags.length ? escapeHtml(activeFlags.join(", ")) : "Belum ada"}<br><br>
      <button class="btn btn-sm" onclick="restartFromZero()">[ RESET TOTAL DARI AWAL ]</button>
    `;
  } else if (tab === "endings") {
    const endings = activeStory.endings || {};
    const rows = Object.entries(endings).map(([id, info]) => {
      const found = unlockedEndings.includes(id);
      return found
        ? `• <b>${escapeHtml(info.title)}</b>: ${escapeHtml(info.summary || "")}`
        : `• <i>[??? — Belum Terbuka]</i>`;
    });
    p.innerHTML = `<b>GALERI ENDING (${unlockedEndings.length}/${Object.keys(endings).length}):</b><br>` +
      (rows.length ? rows.join("<br>") : "<i>Belum ada data ending.</i>");
  }
}

function backToHub() {
  document.getElementById("view-game").style.display = "none";
  document.getElementById("view-hub").style.display = "block";
  document.getElementById("header-title").innerText = "POCKET E-TABLETOP";
  document.getElementById("mode-badge").innerText = "HUB";
  initHub();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

initHub();
</script>
</body>
</html>
